
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUPERCHARGE Holder Test</title>
</head>
<body style="background:#081326;color:white;font-family:Arial;padding:20px">
  <h2>⚡ SUPERCHARGE Holder Test</h2>
  <p>Testing the free Solana connection.</p>
  <button onclick="testConnection()">Test Connection</button>
  <pre id="result" style="white-space:pre-wrap">Not tested yet.</pre>

  <script>
    async function testConnection() {
      const result = document.getElementById("result");
     

      try {
     const response = await fetch("https://solana-rpc.publicnode.com", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: 1,
 method: "getTokenLargestAccounts",
params: ["DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263"]
          })
        });

        if (!response.ok) {
  const details = await response.text();
  throw new Error("HTTP " + response.status + ": " + details.slice(0, 300));
}
        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = "❌ Connection failed: " + error.message;
      }
    }
  </script>
</body>
</html>
